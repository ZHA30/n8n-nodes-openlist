name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Check release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release.mjs
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Pack release
        id: pack
        run: echo "file=$(npm pack --ignore-scripts --quiet)" >> "$GITHUB_OUTPUT"
      - name: Check existing npm version
        id: registry
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: node scripts/check-published.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
      - name: Publish with provenance
        if: steps.registry.outputs.exists != 'true'
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance
